<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Electronics Kenya - Quality smartphones, laptops, headphones and smart watches at affordable prices.">
  <title>Smart Electronics Kenya</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #172033;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #081827;
      color: white;
      text-align: center;
      padding: 24px 15px 18px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 15px rgba(0,0,0,0.18);
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 6px;
      font-weight: 800;
    }

    .brand-green {
      color: #18b957;
    }

    header p {
      color: #d8e2eb;
      font-size: 15px;
      margin-bottom: 17px;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a,
    .cart-nav-button {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 10px 13px;
      border-radius: 8px;
      transition: 0.2s ease;
      border: none;
      background: transparent;
    }

    nav a:hover,
    nav a:active {
      background: #14283c;
    }

    .cart-nav-button {
      background: #16a957;
      min-width: 115px;
    }

    .cart-nav-button:hover,
    .cart-nav-button:active {
      background: #0e8d47;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 430px;
      padding: 70px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      background:
        linear-gradient(rgba(4,20,34,0.78), rgba(4,20,34,0.88)),
        linear-gradient(135deg, #12334b, #071521);
    }

    .hero-content {
      max-width: 850px;
    }

    .hero h2 {
      font-size: 42px;
      line-height: 1.15;
      margin-bottom: 18px;
      font-weight: 800;
    }

    .hero h2 span {
      color: #18c75f;
    }

    .hero p {
      max-width: 700px;
      margin: 0 auto 28px;
      color: #e4edf4;
      font-size: 19px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .primary-button,
    .whatsapp-button {
      border: none;
      border-radius: 9px;
      padding: 14px 25px;
      font-weight: bold;
      color: white;
      text-decoration: none;
      display: inline-block;
      transition: 0.2s ease;
    }

    .primary-button {
      background: #17ad57;
    }

    .primary-button:hover,
    .primary-button:active {
      background: #0d8d45;
      transform: translateY(-1px);
    }

    .whatsapp-button {
      background: #20d76b;
    }

    .whatsapp-button:hover,
    .whatsapp-button:active {
      background: #15bd59;
    }

    /* =========================
       BENEFITS
    ========================= */

    .benefits-section {
      padding: 30px 20px;
      background: #f4f6f8;
    }

    .benefits {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(18,32,51,0.10);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .benefit {
      text-align: center;
      padding: 38px 20px;
      border-right: 1px solid #e6e9ed;
    }

    .benefit:last-child {
      border-right: none;
    }

    .benefit-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .benefit h3 {
      font-size: 21px;
      margin-bottom: 5px;
    }

    .benefit p {
      color: #7b8490;
      font-size: 16px;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products-section {
      padding: 65px 20px;
      background: #f4f6f8;
      text-align: center;
    }

    .section-title {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .section-subtitle {
      color: #737d89;
      margin-bottom: 35px;
      font-size: 17px;
    }

    .products-grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 25px;
    }

    .product {
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 7px 20px rgba(18,32,51,0.10);
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      min-height: 410px;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(18,32,51,0.14);
    }

    .product-icon {
      font-size: 75px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .product h3 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .product-description {
      color: #7a838d;
      font-size: 16px;
      margin-bottom: 18px;
      min-height: 48px;
    }

    .price {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 20px;
      margin-top: auto;
    }
