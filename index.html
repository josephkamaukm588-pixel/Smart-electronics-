<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Electronics Kenya</title>

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#1f2937;
    line-height:1.6;
}

a{
    color:inherit;
}


/* =========================
   HEADER
========================= */

header{
    background:#0b1f33;
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-wrap{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#f59e0b;
}

.logo span{
    color:white;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    color:#22c55e;
}

.menu-btn{
    display:none;
    font-size:30px;
    cursor:pointer;
}


/* =========================
   HERO
========================= */

.hero{
    background:linear-gradient(135deg,#102a43,#1f4e79);
    color:white;
    padding:75px 20px;
    text-align:center;
}

.hero h1{
    font-size:42px;
    margin-bottom:15px;
}

.hero p{
    font-size:19px;
    max-width:700px;
    margin:0 auto 30px;
    color:#e5e7eb;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:15px 25px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    font-size:16px;
}

.shop-btn{
    background:#16a34a;
    color:white;
}

.shop-btn:hover{
    background:#15803d;
}

.whatsapp-btn{
    background:#25d366;
    color:white;
}

.whatsapp-btn:hover{
    background:#1ebe5d;
}


/* =========================
   STATS
========================= */

.stats{
    background:white;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    max-width:1000px;
    margin:auto;
    padding:40px 20px;
    text-align:center;
}

.stat{
    padding:20px;
    border-right:1px solid #e5e7eb;
}

.stat:last-child{
    border-right:none;
}

.stat-icon{
    font-size:35px;
    margin-bottom:10px;
}

.stat h2{
    font-size:30px;
    color:#111827;
}

.stat p{
    color:#6b7280;
}


/* =========================
   PRODUCTS
========================= */

.products-section{
    padding:70px 20px;
    background:#f8fafc;
}

.container{
    max-width:1200px;
    margin:auto;
}

.section-title{
    text-align:center;
    margin-bottom:35px;
}

.section-title h2{
    font-size:40px;
    color:#111827;
    margin-bottom:8px;
}

.section-title p{
    color:#6b7280;
    font-size:18px;
}


/* =========================
   CATEGORY BUTTONS
========================= */

.categories{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:40px;
}

.category-btn{
    border:2px solid #e5e7eb;
    background:white;
    padding:13px 20px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    color:#1f2937;
    transition:0.2s;
}

.category-btn:hover{
    border-color:#16a34a;
    transform:translateY(-2px);
}

.category-btn.active{
    background:#16a34a;
    color:white;
    border-color:#16a34a;
}


/* =========================
   PRODUCT GRID
========================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}


/* =========================
   PRODUCT CARD
========================= */

.product-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
    transition:0.25s;
}

.product-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.product-image{
    height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eef2f7;
    font-size:80px;
}

.product-info{
    padding:20px;
}

.product-info h3{
    font-size:19px;
    margin-bottom:8px;
    color:#111827;
}

.product-info p{
    color:#6b7280;
    font-size:14px;
    margin-bottom:12px;
}

.price{
    font-size:20px;
    font-weight:bold;
    color:#16a34a;
    margin-bottom:15px;
}

.add-cart-btn{
    display:block;
    width:100%;
    text-align:center;
    background:#16a34a;
    color:white;
    padding:12px;
    border:none;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

.add-cart-btn:hover{
    background:#15803d;
}


/* =========================
   CART
========================= */

.cart-section{
    padding:70px 20px;
    background:white;
}

.cart-box{
    max-width:900px;
    margin:auto;
}

.cart-items{
    margin-top:25px;
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:18px;
    margin-bottom:12px;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:12px;
}

.cart-item-info{
    flex:1;
}

.cart-item-info h3{
    font-size:17px;
}

.cart-item-info p{
    color:#16a34a;
    font-weight:bold;
}

.quantity-controls{
    display:flex;
    align-items:center;
    gap:8px;
}

.quantity-btn{
    width:38px;
    height:38px;
    border:none;
    border-radius:8px;
    background:#0b1f33;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.quantity{
    min-width:25px;
    text-align:center;
    font-weight:bold;
}

.remove-btn{
    border:none;
    background:#ef4444;
    color:white;
    padding:9px 12px;
    border-radius:7px;
    cursor:pointer;
}

.cart-total{
    margin-top:25px;
    padding:20px;
    background:#0b1f33;
    color:white;
    border-radius:12px;
    text-align:right;
}

.cart-total h2{
    font-size:24px;
}

.clear-cart{
    margin-top:15px;
    background:#ef4444;
    color:white;
    border:none;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
}

.empty-cart{
    text-align:center;
    padding:35px;
    color:#6b7280;
}


/* =========================
   CHECKOUT
========================= */

.checkout-section{
    padding:70px 20px;
    background:#f8fafc;
}

.checkout-box{
    max-width:700px;
    margin:auto;
}

.checkout-section h2{
    text-align:center;
    margin-bottom:25px;
}

#checkoutForm{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

#checkoutForm input{
    display:block;
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:16px;
}

#checkoutForm input:focus{
    outline:none;
    border-color:#16a34a;
}

.checkout-button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.checkout-button:hover{
    background:#15803d;
}

#orderMessage{
    margin-top:20px;
    padding:15px;
    border-radius:8px;
}


/* =========================
   ABOUT
========================= */

.about{
    padding:70px 20px;
    background:white;
}

.about-box{
    max-width:900
