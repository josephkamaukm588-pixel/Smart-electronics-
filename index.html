<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Electronics Kenya</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f7;
  color:#172033;
}

/* HEADER */

header{
  background:#071827;
  color:white;
  padding:20px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 4px 15px rgba(0,0,0,.2);
}

header h1{
  font-size:30px;
  margin-bottom:5px;
}

.green{
  color:#16b957;
}

header p{
  color:#cbd5df;
  margin-bottom:15px;
}

nav{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

nav a,
.cart-link{
  color:white;
  text-decoration:none;
  padding:10px 12px;
  border-radius:8px;
  font-weight:bold;
  border:none;
  background:transparent;
}

nav a:hover{
  background:#142a3e;
}

.cart-link{
  background:#16ad56;
}

.cart-link:hover{
  background:#0c8f45;
}

/* HERO */

.hero{
  background:
  linear-gradient(rgba(5,21,35,.78),rgba(5,21,35,.88)),
  linear-gradient(135deg,#15415d,#071827);

  color:white;
  text-align:center;
  padding:70px 20px;
}

.hero h2{
  font-size:42px;
  margin-bottom:15px;
}

.hero h2 span{
  color:#17c85e;
}

.hero p{
  max-width:700px;
  margin:auto;
  color:#dce6ee;
  font-size:18px;
  margin-bottom:25px;
}

.hero-button{
  display:inline-block;
  background:#16ad56;
  color:white;
  text-decoration:none;
  padding:15px 28px;
  border-radius:9px;
  font-weight:bold;
}

/* BENEFITS */

.benefits{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.benefit{
  background:white;
  padding:25px 15px;
  text-align:center;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.07);
}

.benefit-icon{
  font-size:35px;
  margin-bottom:8px;
}

.benefit h3{
  margin-bottom:5px;
}

.benefit p{
  color:#777;
}

/* PRODUCTS */

.products-section{
  padding:55px 15px;
}

.section-title{
  text-align:center;
  font-size:34px;
  margin-bottom:8px;
}

.section-subtitle{
  text-align:center;
  color:#747d87;
  margin-bottom:35px;
}

.products-grid{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
}

/* PRODUCT CARD */

.product{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,.09);
  transition:.2s;
  cursor:pointer;
}

.product:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 28px rgba(0,0,0,.14);
}

.product-image{
  width:100%;
  height:280px;
  object-fit:cover;
  display:block;
  background:#e8edf1;
}

.product-info{
  padding:22px;
}

.product-category{
  color:#19a957;
  font-size:14px;
  font-weight:bold;
  text-transform:uppercase;
  margin-bottom:5px;
}

.product h3{
  font-size:25px;
  margin-bottom:7px;
}

.product-description{
  color:#707985;
  min-height:48px;
  margin-bottom:12px;
}

.rating{
  color:#f2a400;
  font-size:20px;
  margin-bottom:8px;
}

.product-price{
  color:#16a956;
  font-size:27px;
  font-weight:bold;
  margin-bottom:18px;
}

.add-button{
  width:100%;
  padding:15px;
  border:none;
  background:#16ad56;
  color:white;
  border-radius:9px;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}

.add-button:hover{
  background:#0d9146;
}

/* CART */

.cart-section{
  background:#eef1f4;
  padding:55px 15px;
}

.cart-container{
  max-width:850px;
  margin:auto;
}

.cart-section h2{
  text-align:center;
  font-size:32px;
  margin-bottom:25px;
}

.empty-cart{
  background:white;
  padding:30px;
  text-align:center;
  border-radius:15px;
  color:#777;
}

.cart-item{
  background:white;
  padding:18px;
  margin-bottom:12px;
  border-radius:14px;
  display:grid;
  grid-template-columns:65px 1fr auto;
  gap:15px;
  align-items:center;
}

.cart-icon{
  font-size:40px;
  text-align:center;
}

.cart-item h3{
  margin-bottom:5px;
}

.cart-item small{
  color:#777;
}

.quantity-controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.quantity-button{
  width:35px;
  height:35px;
  border:none;
  border-radius:7px;
  background:#172033;
  color:white;
  font-weight:bold;
}

.remove-button{
  border:none;
  background:#e52c2c;
  color:white;
  padding:9px 12px;
  border-radius:7px;
  font-weight:bold;
}

.cart-total{
  background:white;
  padding:20px;
  margin-top:20px;
  text-align:center;
  border-radius:12px;
  font-size:25px;
  font-weight:bold;
}

.clear-button{
  display:block;
  margin:18px auto 0;
  border:none;
  background:#e52c2c;
  color:white;
  padding:12px 25px;
  border-radius:8px;
  font-weight:bold;
}

/* CHECKOUT */

.checkout{
  background:white;
  padding:55px 15px;
}

.checkout-container{
  max-width:650px;
  margin:auto;
}

.checkout h2{
  text-align:center;
  font-size:32px;
  margin-bottom:25px;
}

.checkout-form{
  display:grid;
  gap:14px;
}

.checkout-form input{
  width:100%;
  padding:16px;
  border:1px solid #d4d8dd;
  border-radius:9px;
  font-size:16px;
}

.checkout-form input:focus{
  outline:none;
  border-color:#16ad56;
}

.order-button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:9px;
  background:#16ad56;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.order-message{
  text-align:center;
  font-weight:bold;
}

/* CONTACT */

.contact{
  background:#101827;
  color:white;
  text-align:center;
  padding:55
